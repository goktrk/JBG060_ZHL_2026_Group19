# Project configuration: every threshold and parameter lives here.
# Values marked TODO are placeholders the team still has to decide or check.

paths:
  raw: raw_data
  interim: data/interim          # aligned grids, clipped layers (gitignored)
  processed: data/processed      # outputs the dashboard reads
  figures: figures

  admin2: raw_data/Administrative boundaries/ssd_admin2.geojson
  facilities: raw_data/health facilities/Sub-Saharan_public_health_facilities.geojson
  population: raw_data/worldpop/ssd_pop_{year}_CN_100m_R2025A_v1.tif
  flood_recurring: raw_data/flood_masks/compact_recurring   # flood_events_{tile}_{year}.parquet
  flood_unusual: raw_data/flood_masks/compact_unusual
  friction_walking: raw_data/map_friction_maps/2020_walking_only_friction_surface.geotiff   # Malaria Atlas Project, global
  friction_motorised: raw_data/map_friction_maps/2020_motorized_friction_surface.geotiff
  jrc_water: raw_data/JRC_surface_water_data      # JRC Global Surface Water, occurrence_*.tif tiles (v1.5, 1984-2024)

  static_stack: data/interim/static_250m.tif
  flood_monthly: data/interim/flood/flood_{year}_{month:02d}.tif
  flood_months: data/interim/flood_months.csv   # per month: days without any record, flagged months
  permanent_water: data/interim/permanent_water_250m.tif
  counties_table: data/interim/counties.csv
  facilities_table: data/interim/facilities.parquet
  facilities_removed: data/interim/facilities_removed.csv   # every dropped facility, with the reason
  flood_likelihood: data/interim/flood_likelihood_250m.tif   # per calendar month: share of years the cell was flooded

grid:
  crs: "ESRI:102022"             # Africa Albers Equal Area. TODO: confirm vs UTM 36N
  cell_size_m: 250               # flood mask native resolution
  snap_m: 1000                   # origin/extent are multiples of this, so 1 km = exact 4x4 blocks
  buffer_km: 50                  # TODO: margin around South Sudan so border paths are not cut

population:
  year: 2020                     # TODO: confirm; files exist for 2015-2025

flood:
  first_year: 2003               # 2000-2002 are Terra-only, excluded
  last_year: 2025
  tiles: [h20v08, h21v08]        # cover 0-10N only; h20v07/h21v07 needed for the north
  flag_min_missing_days: 3       # months with this many days without any record are flagged (undercounted)
  min_days_flooded: 3            # TODO: days flagged in a month for a cell to count as flooded
  flooded_cell_passable: false   # false = blocked; TODO: decide blocked vs slowed
  season_months: [7, 8, 9, 10, 11]   # TODO: flood season used in recurrence

permanent_water:
  min_occurrence: 75             # a 30 m pixel is permanent water if water in at least this % of observations
  keep_populated_cells_open: true   # cells where people live are never blocked (they have land; riverside towns have crossings)
  close_gaps: true               # close 1-2 cell breaks and corner-only contacts so rivers stay continuous

routing:
  max_flood_likelihood: 0.0      # cells flooded in more than this share of years (that calendar month) are blocked; 0 = flooded in any year
  default_mode: walking          # walking | motorised

priorities:
  top_n: 5                       # facilities shown for protection (greedy order, see README_prioritization.md)
  worst_off_min: 240             # worst-off ranking: people more than this from care without the site, brought back within it
  mode: walking                  # friction layer used for the protection reruns
  output_dir: data/processed/priorities

access_loss:
  output_dir: data/processed/access_loss
  modes: [walking, motorised]    # slow traveller = walking minutes x travel.slow_traveller_factor
  thresholds_min: [60, 120]      # cut off = within this before the flood, beyond it (or unreachable) after

prepositioning:
  output_dir: data/processed/prepositioning
  protected_rankings: [most_saved, worst_off]   # side variant: the Top N of each ranking protected; [] = none
  small_delay_min: 15            # "path blocked" switches with less extra time than this are reported separately

dashboard:
  output_dir: data/processed/dashboard   # pre-rendered map layers (build_dashboard_layers)

evaluation:
  output_dir: data/processed/evaluation   # each year's largest flood month (peak_months, evaluate_peak_months)

# Flood scenarios: observed months picked by data_preparation/select_scenarios.py (EDA/outputs/scenarios_block.yaml)
# flooded = at least flood.min_days_flooded days that month (band "all"); blocked = water | flooded;
# sites with a flooded cell within facilities.flood_buffer_m are closed
scenarios:
  - id: "2008-11"
    label: "2008-11 (Nov 2008 - largest loss)"
    tier: severe
  - id: "2020-11"
    label: "2020-11 (Nov 2020 - worst for Bor South)"
    tier: worst_bor_south
  - id: "2025-10"
    label: "2025-10 (Oct 2025 - typical)"
    tier: medium
  - id: "2025-01"
    label: "2025-01 (Jan 2025 - small)"
    tier: mild

travel:
  modes: [walking, motorised, slow]
  slow_traveller_factor: 1.5     # walking travel cost x this (1.5 or 2)
  time_thresholds_min: [60, 120]
  max_time_min: 120              # cutoff for "reachable"

facilities:
  country: South Sudan             # includes Abyei Region (SS0001, disputed); see data_preparation/README.md
  duplicate_max_distance_m: 50     # duplicates: same type, at most this far apart ...
  duplicate_min_name_similarity: 0.8   # ... and names at least this alike (0-1)
  county_snap_max_m: 2000          # outside every county: snap to the nearest within this, else drop
  flood_buffer_m: 1000           # a site is closed if a flooded cell lies within this distance (0 = own cell only)
  cutoff_drop_share: 0.5         # TODO: drop in population reachable within 2 h that counts as cut off
  manual_off: []                 # facility IDs switched off by hand

recurrence:
  access_loss_threshold: 0.10    # TODO: share of county population losing access

lag:
  max_lag_months: 6

siting:
  candidate_spacing_km: 5
  max_flooded_year_share: 0.10   # TODO: candidate cells flooded in at most this share of years
  max_sites: 20                  # TODO

baseline:
  output_dir: data/processed/baseline
  modes: [walking, motorised]     # slow traveller = walking x travel.slow_traveller_factor
  thresholds_min: [30, 60, 120]   # plus travel.max_time_min
  long_trip_min: 1440             # sanity check: more than 24 h
  admin1: raw_data/Administrative boundaries/ssd_admin1.geojson
  admin3: raw_data/Administrative boundaries/ssd_admin3.geojson
